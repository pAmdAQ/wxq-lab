name: full-lineups
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch all lineup pages (UI body, pageSize=12)
        run: |
          python - <<'PY'
          import json, pathlib, time, urllib.request, datetime
          base = "https://api.datatft.com/wzwxq/lineups/search"
          out = pathlib.Path("data/raw/full-lineups")
          out.mkdir(parents=True, exist_ok=True)
          all_rows, seen, total = [], set(), None
          for page in range(1, 5):
              body = json.dumps({
                  "groupingMode": "rosterSimilarity", "version": "v261106a",
                  "gameType": 2, "time": 7, "minimumCount": 50,
                  "sortBy": "appearanceRate", "page": page, "pageSize": 12,
              }).encode()
              req = urllib.request.Request(base, data=body, method="POST", headers={
                  "User-Agent": "wxq-local-research/1.0 (full lineups; GitHub Actions)",
                  "Content-Type": "application/json", "Accept": "application/json"})
              obj = json.loads(urllib.request.urlopen(req, timeout=60).read().decode())
              print("page", page, "code", obj.get("code"), "msg", obj.get("message"))
              assert obj.get("code") == 1 and obj.get("data"), obj
              data = obj["data"]
              total = data.get("total", total)
              rows = data.get("lineups") or []
              print("page", page, "rows", len(rows), "total", total)
              (out / f"page_{page}.json").write_text(json.dumps(obj, ensure_ascii=False, indent=1), encoding="utf-8")
              new = 0
              for r in rows:
                  k = str(r.get("lineupKey") or "")
                  if k and k not in seen:
                      seen.add(k); all_rows.append(r); new += 1
              if not rows or new == 0 or (total is not None and len(all_rows) >= int(total)):
                  break
              time.sleep(0.8)
          merged = {"code": 1, "data": {"total": total, "pageSize": len(all_rows), "lineups": all_rows}}
          (out / "merged.json").write_text(json.dumps(merged, ensure_ascii=False, indent=1), encoding="utf-8")
          (out / "meta.json").write_text(json.dumps({
              "fetched_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "total": total, "rows": len(all_rows),
          }, ensure_ascii=False, indent=1), encoding="utf-8")
          print("MERGED", len(all_rows), "of", total)
          assert total is not None and len(all_rows) == int(total), (total, len(all_rows))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: full-lineups
          path: data/raw/full-lineups